name: Docs

on:
  push:
    branches: [ main ]
    paths:    [ 'docs/**' ]

  pull_request:
    paths: [ 'docs/**' ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: DasRed/github-workflows/.github/workflows/docs.yml@v2
    secrets:
      website-release-token: ${{ secrets.WEBSITE_RELEASE_TOKEN }}
